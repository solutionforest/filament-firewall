name: "Generate Release Note"

on:
  push:
    tags:
      - "v*" # Triggers for any tag starting with 'v' (e.g., v1.0, v2.1.3)
      - "release-*" # Triggers for any tag starting with 'release-'
      - "1.*.*" # Triggers for any tag starting with '2.' (e.g., 2.0.0, 2.1.0)
      - "2.*.*" # Triggers for any tag starting with '2.' (e.g., 2.0.0, 2.1.0)
      - "3.*.*" # Triggers for any tag starting with '3.' (e.g., 3.0.0, 3.1.0)

permissions:
  contents: write
  pull-requests: read

jobs:

  create-release:
    runs-on: ubuntu-latest
    steps:
     - name: Generate Release Notes
       id: release_notes_generator
       uses: AbsaOSS/generate-release-notes@v0.7.0
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
       with:
         from-tag-name: "2.0.0"
         chapters: |
          - {"title": "Breaking Changes 💥", "label": "breaking-change"}
          - {"title": "New Features 🎉", "label": "enhancement"}
          - {"title": "New Features 🎉", "label": "feature"}
          - {"title": "Bugfixes 🐛", "label": "bug"}
          
